name: Trout Blog Monitor

on:
  schedule:
    # 日本時間(JST)の 9:00, 12:00, 15:00, 18:00, 21:00 に巡回する設定
    # GitHubのCronはUTC（世界標準時）のため、日本時間からマイナス9時間して設定します。
    - cron: '0 0,3,6,9,12 * * *'
  workflow_dispatch: # ブラウザから手動でテスト実行するためのボタンを表示

permissions:
  contents: write # DBファイル(json)の更新をGitHubに保存(コミット)するために必須

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@v4

      - name: Pythonのセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 必要なライブラリのインストール
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml

      - name: スクリプトの実行
        env:
          LINE_TOKEN: ${{ secrets.LINE_TOKEN }}
        run: python main.py

      - name: DBファイルの変更を保存 (自動コミット)
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "DB更新: notified_urls.json"
          file_pattern: "notified_urls.json"
