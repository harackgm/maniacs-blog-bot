name: Trout Blog Monitor

on:
  # GitHub標準のCron(schedule)を削除し、手動および外部APIからの実行のみを許可
  workflow_dispatch: 

permissions:
  contents: write 

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@v4

      - name: Pythonのセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 必要なライブラリのインストール
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml

      - name: スクリプトの実行
        env:
          LINE_TOKEN: ${{ secrets.LINE_TOKEN }}
        run: python main.py

      - name: DBファイルの変更を保存 (自動コミット)
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "DB更新: notified_urls.json"
          file_pattern: "notified_urls.json"
